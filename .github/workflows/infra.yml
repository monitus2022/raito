name: Infrastructure

# Terraform is idempotent, so "skip if it already exists" needs no branching:
# `apply` is a no-op when the remote resource already matches the state. The
# only thing that reintroduces creation is missing or lost state, which is why
# state lives in R2 rather than on a laptop.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_account_id: ${{ vars.CF_ACCOUNT_ID }}
  TF_VAR_zone_id: ${{ vars.CF_ZONE_ID }}
  TF_VAR_domain: ${{ vars.APP_DOMAIN }}
  TF_VAR_team_domain: ${{ vars.CF_TEAM_DOMAIN }}
  TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Configure backend
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Repository variable CF_ACCOUNT_ID is not set"; exit 1; }
          cat > infra/backend.hcl <<EOF
          bucket = "raito-tfstate"
          key    = "raito/terraform.tfstate"
          region = "auto"
          use_path_style = true
          endpoints = { s3 = "https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com" }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          EOF
          cat infra/backend.hcl

      - name: Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform -chdir=infra init -input=false -no-color -backend-config=backend.hcl

      - name: Plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set +e
          terraform -chdir=infra plan -no-color -detailed-exitcode -out=tfplan | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          {
            echo "### Terraform plan"
            echo ""
            echo '```'
            tail -n 300 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "Changes detected."
          else
            echo "No changes. Infrastructure already matches the configuration."
          fi

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            infra/tfplan
            plan.txt
          retention-days: 5

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Manual approval gate. Configure required reviewers on this environment:
    # Settings -> Environments -> production.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Configure backend
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          cat > infra/backend.hcl <<EOF
          bucket = "raito-tfstate"
          key    = "raito/terraform.tfstate"
          region = "auto"
          use_path_style = true
          endpoints = { s3 = "https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com" }
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_s3_checksum            = true
          EOF

      - name: Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform -chdir=infra init -input=false -no-color -backend-config=backend.hcl

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform -chdir=infra apply -no-color -auto-approve
          {
            echo "### Terraform outputs"
            echo ""
            echo '```'
            terraform -chdir=infra output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
